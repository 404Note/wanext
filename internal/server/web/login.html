<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录</title>
<style>
* { box-sizing:border-box; margin:0; padding:0;}
body { background:#0f1115; color:#e8eaf0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center;}
.box { background:#1a1e26; border:1px solid #2a2f3a; border-radius:14px; padding:32px; width:320px;}
.box h1 { font-size:18px; text-align:center; margin-bottom:20px; font-weight:600;}
input { width:100%; background:#12151c; border:1px solid #2a2f3a; border-radius:8px; color:#e8eaf0; padding:11px 12px; font-size:14px; outline:none; margin-bottom:12px;}
input:focus { border-color:#4f8cff;}
button { width:100%; background:#4f8cff; color:#fff; border:none; border-radius:10px; padding:12px; font-size:15px; font-weight:600; cursor:pointer;}
button:hover { background:#3d7bf5;}
button:disabled { background:#2c3a55; cursor:wait;}
.err { color:#ff6b6b; font-size:13px; min-height:20px; margin-top:10px; text-align:center;}
</style>
</head>
<body>
<div class="box">
<h1>登录</h1>
<form id="f">
<input id="u" autocomplete="username" placeholder="账号" autofocus>
<input id="p" type="password" autocomplete="current-password" placeholder="密码">
<button id="b" type="submit">登 录</button>
<div class="err" id="e"></div>
</form>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (ev) => {
ev.preventDefault();
const b = document.getElementById('b'), e = document.getElementById('e');
e.textContent = '';
b.disabled = true;
try {
const r = await fetch('/api/admin/login', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({ username: document.getElementById('u').value.trim(), password: document.getElementById('p').value })
});
const d = await r.json().catch(() => ({}));
if (!r.ok) { e.textContent = d.error || '登录失败'; return; }
location.href = '/';
} catch (ex) {
e.textContent = '网络错误';
} finally {
b.disabled = false;
}
});
</script>
</body>
</html>
