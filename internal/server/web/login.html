<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · wanext</title>
<style>
:root { --bg:#0f1115; --card:#1a1e26; --line:#2a2f3a; --text:#e8eaf0; --muted:#9aa1b2; --accent:#4f8cff; --err:#ff6b6b;}
* { box-sizing:border-box; margin:0; padding:0;}
body { background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center;}
.box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:32px; width:340px;}
.box h1 { font-size:20px; text-align:center; margin-bottom:6px;}
.box h1 span { color:var(--accent);}
.box p { color:var(--muted); font-size:13px; text-align:center; margin-bottom:22px;}
label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px;}
input { width:100%; background:#12151c; border:1px solid var(--line); border-radius:8px; color:var(--text); padding:11px 12px; font-size:14px; outline:none;}
input:focus { border-color:var(--accent);}
button { width:100%; margin-top:22px; background:var(--accent); color:#fff; border:none; border-radius:10px; padding:12px; font-size:15px; font-weight:600; cursor:pointer;}
button:hover { background:#3d7bf5;}
button:disabled { background:#2c3a55; cursor:wait;}
.err { color:var(--err); font-size:13px; min-height:20px; margin-top:10px; text-align:center;}
</style>
</head>
<body>
<div class="box">
<h1>wanext <span>管理登录</span></h1>
<p>登录后进入万能提取演示页</p>
<form id="f">
<label>账号</label>
<input id="username" autocomplete="username" autofocus>
<label>密码</label>
<input id="password" type="password" autocomplete="current-password">
<button id="btn" type="submit">登 录</button>
<div class="err" id="err"></div>
</form>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
e.preventDefault();
const btn = document.getElementById('btn');
const err = document.getElementById('err');
err.textContent = '';
btn.disabled = true; btn.textContent = '登录中…';
try {
const r = await fetch('/api/admin/login', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({
username: document.getElementById('username').value.trim(),
password: document.getElementById('password').value
})
});
const data = await r.json().catch(() => ({}));
if (!r.ok) { err.textContent = data.error || ('登录失败（' + r.status + '）'); return; }
location.href = '/';
} catch (ex) {
err.textContent = '网络错误：' + ex.message;
} finally {
btn.disabled = false; btn.textContent = '登 录';
}
});
</script>
</body>
</html>
